name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 21
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1"
          env: true

      - name: Ensure clang on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # install-llvm-action places llvm-config; clang should sit beside it
          $llvm = $env:LLVM_SYS_211_PREFIX
          if (-not $llvm) { $llvm = $env:LLVM_PATH }
          Write-Host "LLVM prefix: $llvm"
          if ($llvm) {
            echo "$llvm/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Ensure clang on PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "LLVM_SYS_211_PREFIX=${LLVM_SYS_211_PREFIX:-}"
          if [ -n "${LLVM_SYS_211_PREFIX:-}" ]; then
            echo "${LLVM_SYS_211_PREFIX}/bin" >> "$GITHUB_PATH"
          fi
          which llvm-config || true
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi
          which clang

      - name: Cargo test (library crates)
        run: cargo test --workspace --exclude lumia

      - name: Cargo test (lumia CLI + e2e examples)
        run: cargo test -p lumia --tests
