[package]
name = "lumia"
version.workspace = true
edition.workspace = true

[lib]
name = "lumia"
path = "src/lib.rs"

[[bin]]
name = "lumia"
path = "src/main.rs"

[features]
# Default: full codegen + shared libLLVM (Linux/Nix/apt). Windows SDKs are
# static-oriented — use `--no-default-features --features codegen` there (CI/check).
default = ["codegen", "llvm-dynamic"]
# Pulls inkwell/LLVM (~100MB+). LSP / check / fmt do not need this.
# Enables domain loop SR + NSW IV / dense-f64 on opt (codegen stays emit-only for NSW).
codegen = [
    "dep:lumia_codegen",
    "dep:lumia_opt",
    "dep:lumia_core",
    "lumia_codegen/domain-sr",
    "lumia_opt/nsw-iv",
    "lumia_opt/dense-f64-sr",
    "lumia_opt/domain-sr",
]
# Codegen without domain SR / NSW IV / dense-f64 nest rewrite.
codegen-slim = ["dep:lumia_codegen", "dep:lumia_opt", "dep:lumia_core"]
# Shared libLLVM via inkwell force-dynamic (much faster link). On by default.
llvm-dynamic = ["codegen", "lumia_codegen/llvm-dynamic"]

[dependencies]
lumia_syntax.workspace = true
lumia_hir.workspace = true
lumia_ty.workspace = true
lumia_core = { workspace = true, optional = true }
lumia_opt = { workspace = true, optional = true, default-features = false }
lumia_codegen = { workspace = true, optional = true, default-features = false }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rustc-hash = { workspace = true }

[dev-dependencies]
lumia_rt.workspace = true

[lints]
workspace = true
