[package]
name = "lumia"
version.workspace = true
edition.workspace = true

[lib]
name = "lumia"
path = "src/lib.rs"

[[bin]]
name = "lumia"
path = "src/main.rs"

[features]
default = ["codegen"]
# Pulls inkwell/LLVM (~100MB+). LSP / check / fmt do not need this.
codegen = ["dep:lumia_codegen", "dep:lumia_opt"]
llvm-dynamic = ["codegen", "lumia_codegen/llvm-dynamic"]

[dependencies]
lumia_syntax.workspace = true
lumia_hir.workspace = true
lumia_ty.workspace = true
lumia_core.workspace = true
lumia_abi.workspace = true
lumia_opt = { workspace = true, optional = true }
lumia_codegen = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rustc-hash = { workspace = true }

[dev-dependencies]
lumia_rt.workspace = true

[lints]
workspace = true
