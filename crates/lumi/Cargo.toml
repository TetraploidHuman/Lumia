[package]
name = "lumi"
version.workspace = true
edition.workspace = true

[lib]
name = "lumi"
path = "src/lib.rs"

[[bin]]
name = "lumi"
path = "src/main.rs"

[features]
default = ["codegen"]
# Pulls inkwell/LLVM (~100MB+). LSP / check / fmt do not need this.
codegen = ["dep:lumi_codegen", "dep:lumi_opt"]
llvm-dynamic = ["codegen", "lumi_codegen/llvm-dynamic"]

[dependencies]
lumi_syntax.workspace = true
lumi_hir.workspace = true
lumi_ty.workspace = true
lumi_core.workspace = true
lumi_abi.workspace = true
lumi_opt = { workspace = true, optional = true }
lumi_codegen = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rustc-hash = { workspace = true }

[dev-dependencies]
lumi_rt.workspace = true

[lints]
workspace = true
