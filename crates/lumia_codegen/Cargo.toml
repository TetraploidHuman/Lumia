[package]
name = "lumia_codegen"
version.workspace = true
edition.workspace = true

[features]
# Prefer shared libLLVM over static archives (much faster link).
# Useful locally when the LLVM prefix ships libLLVM.so (e.g. Nix); official
# GitHub LLVM tarballs are static-only, so CI keeps prefer-static + lld.
llvm-dynamic = ["inkwell/llvm21-1-force-dynamic"]

[dependencies]
lumia_syntax.workspace = true
lumia_hir.workspace = true
lumia_core.workspace = true
lumia_ty.workspace = true
inkwell.workspace = true
anyhow.workspace = true
thiserror.workspace = true
