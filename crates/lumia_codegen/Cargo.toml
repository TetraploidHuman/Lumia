[package]
name = "lumia_codegen"
version.workspace = true
edition.workspace = true

[features]
# Prefer shared libLLVM over static archives (much faster link).
# Enabled by default through `lumia` (`default = […, "llvm-dynamic"]`).
# Workspace `-p lumia_codegen` / `--workspace --exclude lumia` still need
# `--features lumia_codegen/llvm-dynamic` on Linux (CI/`check.sh`).
# Windows CI stays prefer-static (do not enable this feature).
llvm-dynamic = ["inkwell/llvm21-1-force-dynamic"]
# Domain / bench loop shape rewrites (collatz, floatOrbit).
# Trial-div odd-step lives in lumia_opt. Default on; disable for a thinner
# codegen (generic loops only).
default = ["domain-sr"]
domain-sr = []

[dependencies]
lumia_abi.workspace = true
lumia_hir.workspace = true
lumia_core.workspace = true
lumia_ty.workspace = true
inkwell.workspace = true
anyhow.workspace = true
rustc-hash = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
lumia_opt = { workspace = true, features = ["dense-f64-sr", "nsw-iv", "domain-sr"] }

[lints]
workspace = true
