[package]
name = "lumia_codegen"
version.workspace = true
edition.workspace = true

[features]
# Prefer shared libLLVM over static archives (much faster link).
# Linux CI (apt.llvm.org) and local Nix prefixes ship libLLVM.so; enable via
# `--features lumia_codegen/llvm-dynamic`. Windows CI stays prefer-static.
llvm-dynamic = ["inkwell/llvm21-1-force-dynamic"]

[dependencies]
lumia_abi.workspace = true
lumia_hir.workspace = true
lumia_core.workspace = true
lumia_ty.workspace = true
inkwell.workspace = true
anyhow.workspace = true
rustc-hash = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
lumia_opt.workspace = true

[lints]
workspace = true
