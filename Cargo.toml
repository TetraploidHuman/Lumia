[workspace]
resolver = "2"
members = [
    "crates/lumia",
    "crates/lumia_abi",
    "crates/lumia_syntax",
    "crates/lumia_hir",
    "crates/lumia_ty",
    "crates/lumia_core",
    "crates/lumia_opt",
    "crates/lumia_codegen",
    "crates/lumia_rt",
]
default-members = ["crates/lumia"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/TetraploidHuman/Lumia"

[workspace.dependencies]
lumia_abi = { path = "crates/lumia_abi" }
lumia_syntax = { path = "crates/lumia_syntax" }
lumia_hir = { path = "crates/lumia_hir" }
lumia_ty = { path = "crates/lumia_ty" }
lumia_core = { path = "crates/lumia_core" }
lumia_opt = { path = "crates/lumia_opt", default-features = false }
lumia_codegen = { path = "crates/lumia_codegen", default-features = false }
lumia_rt = { path = "crates/lumia_rt" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
inkwell = { version = "0.10", default-features = false, features = ["llvm21-1", "target-x86"] }
rustc-hash = "2"
corosensei = "0.3.4"

[workspace.lints.clippy]
# Intentionally empty at workspace scope — god-function allows live on the
# crates that need them (`lumia_core` / `lumia_opt` / `lumia_codegen` / `lumia_ty`).
# Do not re-widen here (Todo: 工作区级 clippy allow 仍宽).

# Shipped `lumia` CLI + `lumia_rt`: thin LTO for code quality; RT gets one CGU
# for denser domain kernels. Dev (`cargo build`) stays unaffected.
[profile.release]
lto = "thin"
strip = "debuginfo"

# Domain kernels (`collatz` / dense f64 / …) are clang-linked via `liblumia_rt.a`
# (no cross-language LTO). Keep this package fully optimized — a stale/unopt
# staticlib has shown ~2–3× `bench_cpu` regressions that look like algorithm
# bugs. `cargo clean -p lumia_rt` alone does **not** remove release artifacts;
# use `cargo clean -p lumia_rt --release`.
[profile.release.package.lumia_rt]
codegen-units = 1
opt-level = 3
