[workspace]
resolver = "2"
members = [
    "crates/lumi",
    "crates/lumi_abi",
    "crates/lumi_syntax",
    "crates/lumi_hir",
    "crates/lumi_ty",
    "crates/lumi_core",
    "crates/lumi_opt",
    "crates/lumi_codegen",
    "crates/lumi_rt",
]
default-members = ["crates/lumi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/TetraploidHuman/Lumi"

[workspace.dependencies]
lumi_abi = { path = "crates/lumi_abi" }
lumi_syntax = { path = "crates/lumi_syntax" }
lumi_hir = { path = "crates/lumi_hir" }
lumi_ty = { path = "crates/lumi_ty" }
lumi_core = { path = "crates/lumi_core" }
lumi_opt = { path = "crates/lumi_opt" }
lumi_codegen = { path = "crates/lumi_codegen" }
lumi_rt = { path = "crates/lumi_rt" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
inkwell = { version = "0.10", default-features = false, features = ["llvm21-1", "target-x86"] }
rustc-hash = "2"

[workspace.lints.clippy]
# Helpers shared across HOF / TCO analysis naturally take many parameters.
too_many_arguments = "allow"
# Dyn FnMut callbacks in infer_value_ty_ctx are intentional.
type_complexity = "allow"
# Nested Op/Value matches are clearer than deeply nested patterns in opt/memo.
collapsible_match = "allow"
